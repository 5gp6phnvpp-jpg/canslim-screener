name: Daily CANSLIM Screening

on:
  schedule:
    # 毎日日本時間18:00（UTC 09:00）に実行（月〜金のみ）
    - cron: '0 9 * * 1-5'
  workflow_dispatch:  # 手動実行も可能
    inputs:
      max_stocks:
        description: 'デバッグ用: 分析する銘柄数の上限（0 = 全銘柄）'
        required: false
        default: '0'

jobs:
  screen:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run CANSLIM Screening
        run: npm run screen
        env:
          JQUANTS_API_TOKEN: ${{ secrets.JQUANTS_API_TOKEN }}
          LINE_CHANNEL_TOKEN: ${{ secrets.LINE_CHANNEL_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
          MAX_STOCKS: ${{ github.event.inputs.max_stocks || '0' }}
      
      - name: Upload report artifact
        uses: actions/upload-artifact@v4
        with:
          name: screening-report-${{ github.run_number }}
          path: reports/
          retention-days: 30
      
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        if: github.ref == 'refs/heads/main'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
